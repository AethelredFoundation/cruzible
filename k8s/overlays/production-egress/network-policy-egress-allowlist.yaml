apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cruzible-backend-state-egress
  namespace: cruzible
  annotations:
    egress.cruzible.io/replace-example-cidrs: "true"
    egress.cruzible.io/purpose: PostgreSQL and Redis state stores
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - cruzible-api
          - cruzible-indexer
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 192.0.2.20/32
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cruzible-backend-rpc-egress
  namespace: cruzible
  annotations:
    egress.cruzible.io/replace-example-cidrs: "true"
    egress.cruzible.io/purpose: Chain RPC, indexer RPC, and WebSocket endpoints
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - cruzible-api
          - cruzible-indexer
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8545
        - protocol: TCP
          port: 26657
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cruzible-api-alert-egress
  namespace: cruzible
  annotations:
    egress.cruzible.io/replace-example-cidrs: "true"
    egress.cruzible.io/purpose: Alert webhook delivery
spec:
  podSelector:
    matchLabels:
      app: cruzible-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - protocol: TCP
          port: 443

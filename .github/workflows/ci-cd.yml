name: Cruzible CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - ramesh/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check frontend and tests
        run: npm run type-check

      - name: Run frontend unit tests with coverage
        run: npm run test:ci

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-quality
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject missing frontend public API build config
        run: |
          if node scripts/validate-frontend-public-env.mjs; then
            echo "Expected frontend public build config validation to fail without NEXT_PUBLIC_API_URL"
            exit 1
          fi

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.testnet.aethelred.org
          NEXT_PUBLIC_CHAIN_ENV: testnet
        run: npm run build

      - name: Build frontend container
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.testnet.aethelred.org \
            --build-arg NEXT_PUBLIC_CHAIN_ENV=testnet \
            -t cruzible-frontend:ci .

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: frontend-build
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npm run test:e2e

  backend-api:
    name: Backend API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/api/package-lock.json
            sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        working-directory: ./sdk/typescript
        run: npm ci

      - name: Build and test SDK
        working-directory: ./sdk/typescript
        run: |
          npm run build
          npm test

      - name: Install backend dependencies
        working-directory: ./backend/api
        run: npm ci

      - name: Lint backend API
        working-directory: ./backend/api
        run: npm run lint

      - name: Type-check backend API
        working-directory: ./backend/api
        run: npm run typecheck

      - name: Run backend API tests with coverage
        working-directory: ./backend/api
        run: npm run test:coverage

  backend-containers:
    name: Backend Containers
    runs-on: ubuntu-latest
    needs: backend-api
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build backend API production image
        run: |
          docker build \
            --file backend/api/Dockerfile \
            --target production \
            --tag cruzible-api:ci .

      - name: Build backend indexer image
        run: |
          docker build \
            --file backend/api/Dockerfile \
            --target indexer \
            --tag cruzible-api-indexer:ci .

  release-images:
    name: Release Images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - frontend-build
      - backend-containers
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            image: ghcr.io/aethelred/cruzible/frontend
            dockerfile: Dockerfile
            target: runner
          - name: api
            image: ghcr.io/aethelred/cruzible/api
            dockerfile: backend/api/Dockerfile
            target: production
          - name: api-indexer
            image: ghcr.io/aethelred/cruzible/api-indexer
            dockerfile: backend/api/Dockerfile
            target: indexer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate frontend release config
        if: matrix.name == 'frontend'
        run: |
          test -n "${{ vars.RELEASE_NEXT_PUBLIC_API_URL }}" || (echo "RELEASE_NEXT_PUBLIC_API_URL repository variable is required" && exit 1)
          case "${{ vars.RELEASE_NEXT_PUBLIC_CHAIN_ENV }}" in
            mainnet|testnet|devnet) ;;
            *) echo "RELEASE_NEXT_PUBLIC_CHAIN_ENV must be mainnet, testnet, or devnet" && exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/aethelred-foundation/cruzible
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.RELEASE_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CHAIN_ENV=${{ vars.RELEASE_NEXT_PUBLIC_CHAIN_ENV }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image digest
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/contracts -> target

      - name: Check Rust formatting
        working-directory: ./backend/contracts
        run: cargo fmt --all -- --check

      - name: Validate release manifest template
        working-directory: ./backend/contracts
        run: |
          python3 scripts/validate-release-manifest.py deployments/release-manifest.example.json
          python3 scripts/test-validate-release-manifest.py

      - name: Check audit artifact scripts
        working-directory: ./backend/contracts
        run: |
          bash -n scripts/prepare-audit-artifacts.sh
          bash -n scripts/sign-audit-artifacts.sh
          bash -n scripts/verify-audit-artifact-signatures.sh

      - name: Check contracts compile without warnings
        working-directory: ./backend/contracts
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked

      - name: Lint contracts with Clippy
        working-directory: ./backend/contracts
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run contract tests
        working-directory: ./backend/contracts
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace --locked

      - name: Build optimized CosmWasm artifacts
        working-directory: ./backend/contracts
        run: cargo build --workspace --release --target wasm32-unknown-unknown --locked

      - name: Collect CosmWasm artifact checksums
        working-directory: ./backend/contracts
        run: bash scripts/prepare-audit-artifacts.sh

      - name: Upload CosmWasm audit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cosmwasm-contracts-${{ github.sha }}
          path: backend/contracts/audit-artifacts/contracts
          if-no-files-found: error
          retention-days: 30

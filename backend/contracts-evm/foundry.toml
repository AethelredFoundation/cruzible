[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
solc = "0.8.20"
# Hermetic: no forge-std / external libs — the test declares the minimal Vm
# cheatcode interface it needs, so `forge test` runs without `forge install`.

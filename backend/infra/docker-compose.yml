# Aethelred Blockchain Infrastructure
# Production-grade Docker Compose configuration

services:
  # ============ DATABASE MIGRATIONS ============
  migrate:
    image: ghcr.io/aethelred/cruzible/api-migration@sha256:${CRUZIBLE_MIGRATION_IMAGE_DIGEST:?set CRUZIBLE_MIGRATION_IMAGE_DIGEST}
    restart: "no"
    environment:
      - DATABASE_URL_FILE=/run/secrets/cruzible_database_url
      - CRUZIBLE_MIGRATION_QUIESCED=${CRUZIBLE_MIGRATION_QUIESCED:?set true only after the indexer is stopped and drained}
      - CRUZIBLE_LEGACY_SCHEDULERS_QUIESCED=${CRUZIBLE_LEGACY_SCHEDULERS_QUIESCED:?set true only after every old API scheduler is stopped and drained}
    secrets:
      - cruzible_database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aethelred-network

  # ============ API GATEWAY ============
  api-gateway:
    image: ghcr.io/aethelred/cruzible/api@sha256:${CRUZIBLE_API_IMAGE_DIGEST:?set CRUZIBLE_API_IMAGE_DIGEST}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - NODE_ENV=production
      - CRUZIBLE_RUNTIME_ROLE=api
      - CRUZIBLE_NETWORK=${CRUZIBLE_NETWORK:-testnet}
      - CRUZIBLE_ALLOW_PLAINTEXT_HTTP=${CRUZIBLE_ALLOW_PLAINTEXT_HTTP:-false}
      - PORT=4001
      - RPC_URL=${RPC_URL:?set RPC_URL}
      - GRPC_URL=${GRPC_URL:?set GRPC_URL}
      - DATABASE_URL_FILE=/run/secrets/cruzible_database_url
      - REDIS_URL_FILE=/run/secrets/cruzible_redis_url
      - JWT_SECRET_FILE=/run/secrets/cruzible_jwt_secret
      - JWT_REFRESH_SECRET_FILE=/run/secrets/cruzible_jwt_refresh_secret
      - LOG_HASH_SECRET_FILE=/run/secrets/cruzible_log_hash_secret
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS}
      - AUTH_OPERATOR_ADDRESSES=${AUTH_OPERATOR_ADDRESSES:?set AUTH_OPERATOR_ADDRESSES}
      - AUTH_ADMIN_ADDRESSES=${AUTH_ADMIN_ADDRESSES:-}
      - TRUST_PROXY=1
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      - OPERATIONAL_ENDPOINTS_TOKEN_FILE=/run/secrets/cruzible_operational_token
      - INDEXER_ENABLED=false
      - INDEXER_RPC_URL=${INDEXER_RPC_URL:?set INDEXER_RPC_URL}
      - INDEXER_EXPECTED_CHAIN_ID=${INDEXER_EXPECTED_CHAIN_ID:?set INDEXER_EXPECTED_CHAIN_ID}
      - INDEXER_EXPECTED_GENESIS_HASH=${INDEXER_EXPECTED_GENESIS_HASH:?set INDEXER_EXPECTED_GENESIS_HASH}
      - CRUZIBLE_VAULT_ADDRESS=${CRUZIBLE_VAULT_ADDRESS:?set CRUZIBLE_VAULT_ADDRESS}
      - STAETHEL_ADDRESS=${STAETHEL_ADDRESS:?set STAETHEL_ADDRESS}
      - STABLECOIN_BRIDGE_ADDRESS=${STABLECOIN_BRIDGE_ADDRESS:-}
    secrets:
      - cruzible_database_url
      - cruzible_redis_url
      - cruzible_jwt_secret
      - cruzible_jwt_refresh_secret
      - cruzible_log_hash_secret
      - cruzible_operational_token
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - aethelred-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============ INDEXER ============
  indexer:
    image: ghcr.io/aethelred/cruzible/api-indexer@sha256:${CRUZIBLE_INDEXER_IMAGE_DIGEST:?set CRUZIBLE_INDEXER_IMAGE_DIGEST}
    container_name: aethelred-indexer
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CRUZIBLE_RUNTIME_ROLE=indexer
      - CRUZIBLE_NETWORK=${CRUZIBLE_NETWORK:-testnet}
      - CRUZIBLE_ALLOW_PLAINTEXT_HTTP=${CRUZIBLE_ALLOW_PLAINTEXT_HTTP:-false}
      - RPC_URL=${RPC_URL:?set RPC_URL}
      - DATABASE_URL_FILE=/run/secrets/cruzible_database_url
      - REDIS_URL_FILE=/run/secrets/cruzible_redis_url
      - JWT_SECRET_FILE=/run/secrets/cruzible_jwt_secret
      - JWT_REFRESH_SECRET_FILE=/run/secrets/cruzible_jwt_refresh_secret
      - LOG_HASH_SECRET_FILE=/run/secrets/cruzible_log_hash_secret
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS}
      - METRICS_ENABLED=false
      - API_DOCS_ENABLED=false
      - INDEXER_ENABLED=true
      - INDEXER_RPC_URL=${INDEXER_RPC_URL:?set INDEXER_RPC_URL}
      - INDEXER_WS_URL=${INDEXER_WS_URL:?set INDEXER_WS_URL}
      - INDEXER_START_BLOCK=${INDEXER_START_HEIGHT:-0}
      - INDEXER_EXPECTED_CHAIN_ID=${INDEXER_EXPECTED_CHAIN_ID:?set INDEXER_EXPECTED_CHAIN_ID}
      - INDEXER_EXPECTED_GENESIS_HASH=${INDEXER_EXPECTED_GENESIS_HASH:?set INDEXER_EXPECTED_GENESIS_HASH}
      - INDEXER_HEARTBEAT_FILE=/tmp/cruzible-indexer-heartbeat.json
      - INDEXER_HEARTBEAT_MAX_AGE_MS=45000
      - CRUZIBLE_VAULT_ADDRESS=${CRUZIBLE_VAULT_ADDRESS:?set CRUZIBLE_VAULT_ADDRESS}
      - STAETHEL_ADDRESS=${STAETHEL_ADDRESS:?set STAETHEL_ADDRESS}
      - STABLECOIN_BRIDGE_ADDRESS=${STABLECOIN_BRIDGE_ADDRESS:-}
      - INDEXER_REQUIRE_STABLECOIN_BRIDGE=${INDEXER_REQUIRE_STABLECOIN_BRIDGE:-false}
    secrets:
      - cruzible_database_url
      - cruzible_redis_url
      - cruzible_jwt_secret
      - cruzible_jwt_refresh_secret
      - cruzible_log_hash_secret
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - aethelred-network
    healthcheck:
      test: ["CMD", "node", "dist/indexer-healthcheck.js"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 4
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============ POSTGRESQL ============
  postgres:
    image: postgres@sha256:${POSTGRES_IMAGE_DIGEST:?set POSTGRES_IMAGE_DIGEST}
    container_name: aethelred-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${DB_USER:?set DB_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/cruzible_db_password
      - POSTGRES_DB=${DB_NAME:?set DB_NAME}
      - POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    secrets:
      - cruzible_db_password
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=5242kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
    networks:
      - aethelred-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:?set DB_USER} -d ${DB_NAME:?set DB_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 4G

  # ============ NGINX REVERSE PROXY ============
  nginx:
    image: nginx@sha256:${NGINX_IMAGE_DIGEST:?set NGINX_IMAGE_DIGEST}
    container_name: aethelred-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    secrets:
      - cruzible_tls_certificate
      - cruzible_tls_private_key
    depends_on:
      - api-gateway
    networks:
      - aethelred-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/nginx-health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============ PROMETHEUS ============
  prometheus:
    image: prom/prometheus@sha256:${PROMETHEUS_IMAGE_DIGEST:?set PROMETHEUS_IMAGE_DIGEST}
    container_name: aethelred-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - cruzible_operational_token
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - aethelred-network

  # ============ GRAFANA ============
  grafana:
    image: grafana/grafana@sha256:${GRAFANA_IMAGE_DIGEST:?set GRAFANA_IMAGE_DIGEST}
    container_name: aethelred-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?set GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/cruzible_grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:?set GRAFANA_ROOT_URL}
    secrets:
      - cruzible_grafana_password
    networks:
      - aethelred-network
    depends_on:
      - prometheus

  # ============ JAEGER (TRACING) ============
  jaeger:
    image: jaegertracing/all-in-one@sha256:${JAEGER_IMAGE_DIGEST:?set JAEGER_IMAGE_DIGEST}
    container_name: aethelred-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - aethelred-network

networks:
  aethelred-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

secrets:
  cruzible_database_url:
    file: ${DATABASE_URL_FILE:?set DATABASE_URL_FILE}
  cruzible_redis_url:
    file: ${REDIS_URL_FILE:?set REDIS_URL_FILE}
  cruzible_db_password:
    file: ${DB_PASSWORD_FILE:?set DB_PASSWORD_FILE}
  cruzible_jwt_secret:
    file: ${JWT_SECRET_FILE:?set JWT_SECRET_FILE}
  cruzible_jwt_refresh_secret:
    file: ${JWT_REFRESH_SECRET_FILE:?set JWT_REFRESH_SECRET_FILE}
  cruzible_log_hash_secret:
    file: ${LOG_HASH_SECRET_FILE:?set LOG_HASH_SECRET_FILE}
  cruzible_operational_token:
    file: ${OPERATIONAL_ENDPOINTS_TOKEN_FILE:?set OPERATIONAL_ENDPOINTS_TOKEN_FILE}
  cruzible_grafana_password:
    file: ${GRAFANA_PASSWORD_FILE:?set GRAFANA_PASSWORD_FILE}
  cruzible_tls_certificate:
    file: ${NGINX_TLS_CERT_FILE:?set NGINX_TLS_CERT_FILE}
  cruzible_tls_private_key:
    file: ${NGINX_TLS_KEY_FILE:?set NGINX_TLS_KEY_FILE}

user nginx;
worker_processes auto;
pcre_jit on;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'request_id=$request_id upstream=$upstream_addr '
                  'upstream_status=$upstream_status request_time=$request_time';

  access_log /var/log/nginx/access.log main;
  server_tokens off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  client_max_body_size 1m;

  limit_req_zone $binary_remote_addr zone=cruzible_api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=cruzible_auth:10m rate=5r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream cruzible_api {
    server api-gateway:4001;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /run/secrets/cruzible_tls_certificate;
    ssl_certificate_key /run/secrets/cruzible_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location ^~ /v1/auth/ {
      limit_req zone=cruzible_auth burst=20 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://cruzible_api;
    }

    location /socket.io/ {
      limit_req zone=cruzible_api burst=120 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
      proxy_pass http://cruzible_api;
    }

    location / {
      limit_req zone=cruzible_api burst=120 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_pass http://cruzible_api;
    }
  }
}
